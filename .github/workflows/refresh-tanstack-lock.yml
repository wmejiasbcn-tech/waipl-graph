name: Refresh patched TanStack lockfile — remediation run

on:
  push:
    branches:
      - fix/tanstack-start-cve-2026-102989
    paths:
      - package.json
      - .github/workflows/refresh-tanstack-lock.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/tanstack-start-cve-2026-102989
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from patched dependency constraints
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact locked dependency tree
        run: npm ci
      - name: Verify patched TanStack packages
        run: |
          npm ls @tanstack/react-start @tanstack/start-server-core
          node -e "const l=require('./package-lock.json'); const p=l.packages; if(p['node_modules/@tanstack/react-start'].version !== '1.168.60') process.exit(1); if(p['node_modules/@tanstack/start-server-core'].version !== '1.169.39') process.exit(1)"
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): regenerate lockfile for patched TanStack Start"
          git push origin HEAD:fix/tanstack-start-cve-2026-102989
