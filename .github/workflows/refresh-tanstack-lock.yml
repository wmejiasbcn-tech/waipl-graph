name: Dependency lockfile refresh and verification

on:
  push:
    branches:
      - fix/tanstack-start-cve-2026-102989
    paths:
      - package.json
      - .github/workflows/refresh-tanstack-lock.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate lockfile from approved dependency constraints
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Apply non-breaking security updates
        run: npm audit fix --legacy-peer-deps --ignore-scripts
      - name: Install locked dependency tree
        run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=low
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit regenerated lockfile
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): regenerate and verify lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
